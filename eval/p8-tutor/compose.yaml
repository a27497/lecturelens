    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: p8
      POSTGRES_PASSWORD: p8-local-only
      POSTGRES_DB: lecturelens_agent_acceptance
    ports:
      - "127.0.0.1:25741:5432"
    volumes:
      - p8-tutor-protocol-postgres:/var/lib/postgresql/data
volumes:
  p8-tutor-protocol-postgres:
