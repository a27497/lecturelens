services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: tutor_scale
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: lecturelens_agent_acceptance
    ports:
      - "127.0.0.1:25841:5432"
    mem_limit: 384m
    cpus: 0.5
    shm_size: 64m
    volumes:
      - tutor-scale-postgres:/var/lib/postgresql/data
volumes:
  tutor-scale-postgres:
