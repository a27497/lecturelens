name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Make Maven Wrapper executable
        working-directory: backend
        run: chmod +x ./mvnw

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test:unit

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mock-infrastructure-e2e:
    name: MySQL migrations and Mock AI E2E
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Start isolated infrastructure
        run: |
          cp .env.demo.example .env.demo.local
          LECTURELENS_DEMO_INSTANCE=ci bash scripts/demo/start-infrastructure.sh
      - name: Package tested backend
        working-directory: backend
        run: bash ./mvnw -B -DskipTests package
      - name: Run HTTP E2E with empty MySQL and no external AI
        run: python3 scripts/ci/mock-e2e.py --project lecturelens-demo-ci
      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-e2e-log
          path: .demo/mock-e2e-backend.log
          retention-days: 3
      - name: Remove this job's infrastructure
        if: always()
        run: docker compose --project-name lecturelens-demo-ci --env-file .env.demo.local down --volumes
